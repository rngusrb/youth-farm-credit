# meta/project_state.yaml — harness Doc Lint 의 검증 원천.
# 여기 적힌 경로가 존재하지 않으면 harness all 이 FAIL 한다.

entry_points:
  api: apps/api/main.py
  web: apps/web/app/page.tsx

archive_dir: docs/sprints

folder_guides:
  # 키가 곧 폴더 경로다 (harness.all_folders 가 키를 대상으로 삼는다).
  # 레이어가 루트가 아니라 apps/api 아래에 있다 — boundaries.yaml 참조.
  apps/api:         apps/api/_GUIDE.md
  apps/api/engine:     apps/api/engine/_GUIDE.md
  apps/api/estimators: apps/api/estimators/_GUIDE.md
  apps/api/llm:     apps/api/llm/_GUIDE.md
  apps/api/rag:     apps/api/rag/_GUIDE.md
  apps/api/stats:      apps/api/stats/_GUIDE.md
  apps/web:            apps/web/_GUIDE.md

harness:
  max_active_tasks: 3
  task_heading_regex: "^#{2,3} [A-Z][A-Z0-9]*-[A-Za-z0-9]+:"
  # 테스트는 apps/api/tests/ 에 모여 있고, 폴더별 목록은 각 _GUIDE.md 의 '## 하네스' 에 있다
  test_path_prefixes: ["apps/api/tests/", "apps/web/tests/"]

  # 폴더별 테스트 러너. 없으면 pytest.
  # 새 앱은 여기에 자기 명령을 등록한다 — 그래야 harness all 이 그 앱도 돈다.
  runners:
    apps/web: ["npx", "--prefix", "apps/web", "vitest", "run", "--root", "apps/web"]

  # 가이드가 언급해야 할 '모듈' 의 모양. 언어마다 다르다.
  # 웹은 컴포넌트가 아니라 **라우트**를 검사한다 — 제품 표면이고 제일 잘 썩는다.
  module_globs:
    apps/web: ["app/*/page.tsx"]
  test_globs:
    - "apps/api/tests/test_{key}*.py"
  always_run: []
  skip_dirs: ["__pycache__", ".venv", "venv", "node_modules", ".git", ".next",
              "site-packages", "dist", "build", ".harness_cache", ".loop"]
  ruff: false          # 아직 ruff 설정을 안 넣었다. 넣는 순간 true 로.

loop:
  score_order: [failed, lint_fail, gc]
  max_rounds: 8
  stall_rounds: 3
  guard_tests: true

ui_check:
  # 화면을 바꾼 뒤 ui_check 를 안 돌리면 harness 가 알려준다 (자동 실행은 서버가 필요해서 불가).
  # level: FAIL 로 올리면 커밋을 막는다. 기본은 WARN — 기록이지 게이트가 아니다.
  level: WARN

  base_url: "http://localhost:3000"

  # 로그인 뒤 화면에 심을 localStorage.
  # 2026-08-28 이전까지 세션을 못 심어서 /bank·/app/* 을 **한 번도 검사한 적이 없었다.**
  # 세 화면이 전부 '내용 101단위' 로 같게 나온 것이 증거였고, 그 뒤에 모바일 업무 탭
  # 35×44 (WCAG 2.5.5 위반)가 숨어 있었다.
  #
  # ⚠️ 여기 들어가는 것은 **코드에 이미 있는 데모 계정뿐**이다 (apps/web/lib/auth.ts).
  #    실제 인증이 붙는 순간 이 블록은 폐기하고 다른 방법을 쓴다.
  sessions:
    farmer:
      yfc.session.v1: '{"id":"000000","role":"farmer","name":"김청년","org":"청년후계농","at":1}'
      yfc.profile.v1: '{"cropId":"strawberry_hydro","pyeong":1200,"livingCost":30000000,"otherDebtService":0,"incomeHistory":[],"productId":"successor_farmer"}'
    # 「지난 분석과 달라진 것」 은 기록이 2건 이상이어야 나온다.
    # 세션만 심으면 그 블록이 영영 검사되지 않는다.
    farmer_with_history:
      yfc.session.v1: '{"id":"000000","role":"farmer","name":"김청년","org":"청년후계농","at":1}'
      yfc.profile.v1: '{"cropId":"strawberry_hydro","pyeong":1200,"livingCost":30000000,"otherDebtService":0,"incomeHistory":[],"productId":"successor_farmer"}'
      yfc.reports.v1: '[{"id": "dg_new", "cropName": "딸기(시설,수경)", "pyeong": 1500, "productName": "후계농업경영인 육성자금", "riskLimit": 268000000, "crisisProb": 0.0812, "savedAt": 1787900000000}, {"id": "dg_old", "cropName": "딸기(시설,수경)", "pyeong": 1200, "productName": "후계농업경영인 육성자금", "riskLimit": 210815430, "crisisProb": 0.0999, "savedAt": 1787700000000}]'
    # 실적·계획을 넣은 농가. 이게 없으면 "실적 기반 소득"·"올해 계획대로" 블록이
    # 영영 검사되지 않는다 — 기본 프로필의 incomeHistory 가 [] 라 항상 추정 경로로만 돈다.
    farmer_with_actuals:
      yfc.session.v1: '{"id":"000000","role":"farmer","name":"김청년","org":"청년후계농","at":1}'
      yfc.profile.v1: '{"cropId":"strawberry_hydro","pyeong":1300,"livingCost":30000000,"otherDebtService":0,"incomeHistory":[48000000,52000000,45000000],"productId":"successor_farmer","plannedPyeong":1800,"targetPrincipal":300000000}'
    bank:
      yfc.session.v1: '{"id":"222222","role":"bank","name":"박심사","org":"농협은행 여신심사부","at":1}'
      yfc.profile.v1: '{"cropId":"strawberry_hydro","pyeong":1200,"livingCost":30000000,"otherDebtService":0,"incomeHistory":[],"productId":"successor_farmer"}'

  # `python3 scripts/ui_check.py all` 이 도는 대상. as 가 없으면 비로그인 상태.
  targets:
    - { path: "/" }
    - { path: "/crops" }
    - { path: "/market" }
    - { path: "/library" }
    - { path: "/policy" }
    - { path: "/glossary" }
    - { path: "/app",          as: farmer }
    - { path: "/app/farm",     as: farmer }
    - { path: "/app/revenue",  as: farmer }
    - { path: "/app/safety",   as: farmer }
    - { path: "/app/finance",  as: farmer }
    - { path: "/app/relief",   as: farmer }
    - { path: "/app/reports",  as: farmer_with_history }
    # 2026-09-02: 아래 다섯이 목록에 없어 **한 번도 검사된 적이 없었다.**
    # levers·prescribe·assistant 는 만들어 놓고 대상에 안 넣었고,
    # checkup·map 은 이번에 새로 만든 5단계 화면이다.
    - { path: "/app/checkup",   as: farmer_with_actuals }
    - { path: "/app/map",       as: farmer_with_actuals }
    - { path: "/app/levers",    as: farmer_with_actuals }
    - { path: "/app/prescribe", as: farmer_with_actuals }
    - { path: "/app/assistant", as: farmer }
    - { path: "/bank",          as: bank }
    - { path: "/bank/applicants", as: bank }
    - { path: "/bank/capacity", as: bank }
    - { path: "/bank/design",   as: bank }
    - { path: "/bank/stress",   as: bank }
  watch:
    - "apps/web/app/**/*.tsx"
    - "apps/web/components/**/*.tsx"
    - "apps/web/tailwind.config.ts"
